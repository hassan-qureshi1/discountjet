api_version = "2026-01"
[[extensions]]
name = "Buy-X Discount Both"
description = "Configure special (source + discounted sets) product discounts"
handle = "discount-special-ui"
uid = "c60f6699-9eaa-726f-34ce-506ec4c19cf69fd2cf56"
type = "ui_extension"
[[extensions.targeting]]
module = "./src/DiscountSpecialSettings.tsx"
target = "admin.discount-details.function-settings.render"

[[extensions.metafields]]
namespace = "$app:discount-special"
key = "config"

# Names the campaign that owns this discount, when one created it. Declared
# here because an extension receives only the metafields it lists: without this
# block the value exists on the discount but never reaches the UI, and the
# fields would stay editable with nothing showing anything was wrong.
[[extensions.metafields]]
namespace = "$app:discount-special"
key = "campaign"
