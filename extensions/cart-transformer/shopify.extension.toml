api_version = "2026-01"

[[extensions]]
name = "Cart Transformer"
handle = "cart-transformer"
type = "function"
uid = "a1c2f4e6-7b8d-4a2f-9c1e-5d3a6b8c9d0e"
description = "t:description"

  [[extensions.targeting]]
  target = "cart.transform.run"
  input_query = "src/cart_transform_run.graphql"
  export = "cart_transform_run"

  [extensions.build]
  command = "cargo build --target=wasm32-unknown-unknown --release"
  path = "target/wasm32-unknown-unknown/release/cart-transformer.wasm"
  watch = [ "src/**/*.rs" ]
