[package]
name = "discount-tier-fn"
version = "1.0.0"
edition = "2021"

# Pure-logic library (config/shared/engine) — Shopify-independent, unit + parity
# tested via `cargo test`. The wasm bin (src/main.rs) uses it through the
# `discount_tier` crate name.
[lib]
name = "discount_tier"
path = "src/lib.rs"

[[bin]]
name = "discount-tier-fn"
path = "src/main.rs"

[dependencies]
shopify_function = "2.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
